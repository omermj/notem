name: Feature request
description: Propose a focused improvement to NoteM.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Explain the user problem before proposing an implementation. NoteM intentionally excludes cloud sync, accounts, mobile, collaborative editing, and a plugin marketplace from its current scope.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult today, and who encounters it?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest user-visible behavior that would solve the problem.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include current workarounds or simpler approaches where applicable.

  - type: dropdown
    id: scope
    attributes:
      label: Affected area
      options:
        - Editor and Markdown
        - Vault and file handling
        - Search, links, tags, or graph
        - PDF viewer
        - Appearance and accessibility
        - Packaging or platform integration
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add redacted mockups or examples if useful. Attachments are public.
