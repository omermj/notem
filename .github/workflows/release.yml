name: Build draft release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, for example v0.2.1
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-22.04
    outputs:
      commit_sha: ${{ steps.tag.outputs.commit_sha }}
      tag_object_sha: ${{ steps.tag.outputs.tag_object_sha }}
    steps:
      - name: Validate and resolve annotated tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be an exact semantic version such as v0.2.1." >&2
            exit 1
          fi

          ref_json="$(gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG")"
          object_type="$(jq -r '.object.type' <<<"$ref_json")"
          tag_object_sha="$(jq -r '.object.sha' <<<"$ref_json")"

          if [[ "$object_type" != "tag" ]]; then
            echo "Release tag must be annotated; lightweight tags are rejected." >&2
            exit 1
          fi

          tag_json="$(gh api "repos/$REPOSITORY/git/tags/$tag_object_sha")"
          if [[ "$(jq -r '.object.type' <<<"$tag_json")" != "commit" ]]; then
            echo "Release tag must point directly to a commit." >&2
            exit 1
          fi

          commit_sha="$(jq -r '.object.sha' <<<"$tag_json")"
          if [[ ! "$commit_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GitHub returned an invalid commit SHA for $RELEASE_TAG." >&2
            exit 1
          fi

          echo "commit_sha=$commit_sha" >>"$GITHUB_OUTPUT"
          echo "tag_object_sha=$tag_object_sha" >>"$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: validate
    permissions:
      contents: read
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            platform: ubuntu-22.04
            rust_target: ""
            tauri_args: --bundles appimage,deb
            artifact_name: installers-linux-x64
            target_root: src-tauri/target/release
            artifact_paths: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
          - name: macOS ARM
            platform: macos-14
            rust_target: aarch64-apple-darwin
            tauri_args: --target aarch64-apple-darwin --bundles dmg
            artifact_name: installers-macos-arm64
            target_root: src-tauri/target/aarch64-apple-darwin/release
            artifact_paths: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows x64
            platform: windows-2025
            rust_target: ""
            tauri_args: --bundles nsis
            artifact_name: installers-windows-x64
            target_root: src-tauri/target/release
            artifact_paths: src-tauri/target/release/bundle/nsis/*.exe

    steps:
      - name: Checkout validated release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.18.0

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build outputs
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag matches the application version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/verify-release-version.mjs

      - name: Build platform bundle
        run: pnpm tauri build ${{ matrix.tauri_args }}

      - name: Verify bundled legal documents
        run: node scripts/verify-bundle-legal.mjs ${{ matrix.target_root }}

      - name: Upload platform bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish-draft:
    name: Create or update draft release
    needs: [validate, build]
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: write
    steps:
      - name: Revalidate tag has not moved
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_TAG_OBJECT_SHA: ${{ needs.validate.outputs.tag_object_sha }}
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          if [[ "$current_sha" != "$EXPECTED_TAG_OBJECT_SHA" ]]; then
            echo "Release tag moved while artifacts were building; refusing to publish." >&2
            exit 1
          fi

      - name: Download platform bundles
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: installers-*
          path: release-artifacts
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: release-artifacts
        run: |
          set -euo pipefail
          find . -type f -print0 \
            | sort -z \
            | while IFS= read -r -d '' file; do sha256sum "$file"; done \
            > SHA256SUMS
          test -s SHA256SUMS

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_TAG_OBJECT_SHA: ${{ needs.validate.outputs.tag_object_sha }}
        run: |
          set -euo pipefail

          current_sha="$(gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          if [[ "$current_sha" != "$EXPECTED_TAG_OBJECT_SHA" ]]; then
            echo "Release tag moved before upload; refusing to publish." >&2
            exit 1
          fi

          if release_json="$(gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json isDraft 2>/dev/null)"; then
            if [[ "$(jq -r '.isDraft' <<<"$release_json")" != "true" ]]; then
              echo "A non-draft release already exists for $RELEASE_TAG; refusing to modify it." >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" \
              --repo "$REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --notes $'## Signing and verification\n\nThis release is not code-signed or notarized. Operating systems may display an unknown-publisher warning. Verify downloads against the attached `SHA256SUMS` file before installation.' \
              --draft \
              --title "NoteM $RELEASE_TAG"
          fi

          mapfile -d '' artifacts < <(find release-artifacts -type f -print0 | sort -z)
          if (( ${#artifacts[@]} == 0 )); then
            echo "No release artifacts were downloaded." >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${artifacts[@]}" \
            --repo "$REPOSITORY" \
            --clobber
