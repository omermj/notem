name: Build draft release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, for example v0.2.1
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-22.04
    outputs:
      commit_sha: ${{ steps.tag.outputs.commit_sha }}
      tag_object_sha: ${{ steps.tag.outputs.tag_object_sha }}
    steps:
      - name: Validate and resolve annotated tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be an exact semantic version such as v0.2.1." >&2
            exit 1
          fi

          ref_json="$(gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG")"
          object_type="$(jq -r '.object.type' <<<"$ref_json")"
          tag_object_sha="$(jq -r '.object.sha' <<<"$ref_json")"

          if [[ "$object_type" != "tag" ]]; then
            echo "Release tag must be annotated; lightweight tags are rejected." >&2
            exit 1
          fi

          tag_json="$(gh api "repos/$REPOSITORY/git/tags/$tag_object_sha")"
          if [[ "$(jq -r '.object.type' <<<"$tag_json")" != "commit" ]]; then
            echo "Release tag must point directly to a commit." >&2
            exit 1
          fi

          commit_sha="$(jq -r '.object.sha' <<<"$tag_json")"
          if [[ ! "$commit_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GitHub returned an invalid commit SHA for $RELEASE_TAG." >&2
            exit 1
          fi

          echo "commit_sha=$commit_sha" >>"$GITHUB_OUTPUT"
          echo "tag_object_sha=$tag_object_sha" >>"$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: validate
    permissions:
      contents: read
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            platform: ubuntu-22.04
            rust_target: ""
            platform_key: linux-x86_64
            tauri_args: --bundles appimage,deb --config src-tauri/tauri.updater.conf.json
            artifact_name: installers-linux-x64
            target_root: src-tauri/target/release
          - name: macOS ARM
            platform: macos-14
            rust_target: aarch64-apple-darwin
            platform_key: darwin-aarch64
            tauri_args: --target aarch64-apple-darwin --bundles app,dmg --config src-tauri/tauri.updater.conf.json
            artifact_name: installers-macos-arm64
            target_root: src-tauri/target/aarch64-apple-darwin/release
          - name: Windows x64
            platform: windows-2025
            rust_target: ""
            platform_key: windows-x86_64
            tauri_args: --bundles nsis --config src-tauri/tauri.updater.conf.json
            artifact_name: installers-windows-x64
            target_root: src-tauri/target/release

    steps:
      - name: Checkout validated release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
          components: clippy
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build outputs
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag matches the application version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/verify-release-version.mjs

      - name: Verify workflow policy
        run: node scripts/verify-workflow-policy.mjs

      - name: Run native Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Run native Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build platform bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          node scripts/verify-signing-secrets.mjs
          pnpm tauri build ${{ matrix.tauri_args }}

      - name: Verify Windows GUI subsystem
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $executable = 'src-tauri/target/release/notem.exe'
          $bytes = [System.IO.File]::ReadAllBytes($executable)
          if ($bytes.Length -lt 256) {
            throw "Windows executable is unexpectedly short."
          }
          $peOffset = [System.BitConverter]::ToInt32($bytes, 0x3c)
          $signature = [System.Text.Encoding]::ASCII.GetString($bytes, $peOffset, 4)
          if ($signature -ne "PE`0`0") {
            throw "Windows executable has an invalid PE signature."
          }
          $subsystem = [System.BitConverter]::ToUInt16($bytes, $peOffset + 24 + 68)
          if ($subsystem -ne 2) {
            throw "Expected Windows GUI subsystem 2, found $subsystem."
          }
          Write-Host "Verified Windows GUI subsystem 2 (no console window)."

      - name: Fix Linux AppImage
        if: runner.os == 'Linux'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          appimage_path="src-tauri/target/release/bundle/appimage/NoteM_${RELEASE_TAG#v}_amd64.AppImage"
          bash scripts/fix-linux-appimage.sh "$appimage_path"

      - name: Re-sign Linux AppImage
        if: runner.os == 'Linux'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          node scripts/verify-signing-secrets.mjs
          appimage_path="src-tauri/target/release/bundle/appimage/NoteM_${RELEASE_TAG#v}_amd64.AppImage"
          pnpm tauri signer sign "$appimage_path"
          signature_path="${appimage_path}.sig"
          test -s "$signature_path"

      - name: Verify fixed Linux AppImage
        if: runner.os == 'Linux'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          appimage_path="src-tauri/target/release/bundle/appimage/NoteM_${RELEASE_TAG#v}_amd64.AppImage"
          node scripts/verify-linux-appimage.mjs "$appimage_path"

      - name: Verify bundled legal documents
        run: node scripts/verify-bundle-legal.mjs ${{ matrix.target_root }}

      - name: Collect exact platform release artifacts
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          node scripts/collect-release-artifacts.mjs
          --platform ${{ matrix.platform_key }}
          --source-root ${{ matrix.target_root }}
          --output release-artifacts

      - name: Upload platform bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: release-artifacts
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish-draft:
    name: Create or update draft release
    needs: [validate, build]
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: write
    steps:
      - name: Revalidate tag has not moved
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_TAG_OBJECT_SHA: ${{ needs.validate.outputs.tag_object_sha }}
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          if [[ "$current_sha" != "$EXPECTED_TAG_OBJECT_SHA" ]]; then
            echo "Release tag moved while artifacts were building; refusing to publish." >&2
            exit 1
          fi

      - name: Checkout validated release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}
          persist-credentials: false

      - name: Download platform bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: installers-*
          path: release-artifacts
          merge-multiple: false

      - name: Obtain immutable tag metadata
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
          TAG_OBJECT_SHA: ${{ needs.validate.outputs.tag_object_sha }}
        run: |
          set -euo pipefail
          tag_json="$(gh api "repos/$REPOSITORY/git/tags/$TAG_OBJECT_SHA")"
          publication_date="$(jq -r '.tagger.date // empty' <<<"$tag_json")"
          if [[ -z "$publication_date" ]]; then
            echo "Annotated release tag has no immutable tagger date." >&2
            exit 1
          fi
          echo "publication_date=$publication_date" >>"$GITHUB_OUTPUT"

      - name: Validate and stage exact release assets
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          node scripts/stage-release-assets.mjs
          --input release-artifacts
          --output release-assets
          --updater-output updater-artifacts
          --version "${RELEASE_TAG#v}"

      - name: Obtain deterministic release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          release_json_path="release-metadata.json"
          release_fetch_path="release-metadata.fetch"
          release_error_path="release-metadata.error"
          rm -f "$release_json_path" "$release_fetch_path" "$release_error_path"
          published_id="$(gh api --paginate "repos/$REPOSITORY/releases?per_page=100" \
            --jq "[.[] | select(.draft == false and .tag_name == \"$RELEASE_TAG\")] | .[0].id // empty")"
          if [[ -n "$published_id" ]]; then
            echo "A non-draft release already exists for $RELEASE_TAG; refusing to modify it." >&2
            exit 1
          fi
          draft_id="$(gh api --paginate "repos/$REPOSITORY/releases?per_page=100" \
            --jq "[.[] | select(.draft == true and (.tag_name == \"$RELEASE_TAG\" or .name == \"NoteM $RELEASE_TAG\"))] | sort_by(.created_at) | .[0].id // empty")"
          if [[ -n "$draft_id" ]]; then
            if gh api "repos/$REPOSITORY/releases/$draft_id" >"$release_fetch_path" 2>"$release_error_path"; then
              mv "$release_fetch_path" "$release_json_path"
            else
              cat "$release_error_path" >&2
              exit 1
            fi
            notes="$(jq -r '.body // empty' "$release_json_path")"
          else
            notes="$(gh api --method POST "repos/$REPOSITORY/releases/generate-notes" -f "tag_name=$RELEASE_TAG" --jq '.body')"
          fi
          if [[ -z "$notes" ]]; then
            notes="NoteM $RELEASE_TAG release."
          fi
          {
            printf '%s\n' "$notes" | awk '/^## Signing and verification$/ { exit } { print }'
            printf '\n## Signing and verification\n\n'
            printf '%s\n' 'Tauri updater payloads are signed with the project updater key. Verify SHA256SUMS before installation. These artifact signatures do not provide Apple notarization or Windows publisher code signing.'
          } >release-notes.txt
          test -s release-notes.txt

      - name: Generate latest.json
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ inputs.tag }}
          RELEASE_PUBLICATION_DATE: ${{ steps.metadata.outputs.publication_date }}
        run: >-
          node scripts/generate-updater-manifest.mjs
          --artifacts-directory updater-artifacts
          --output release-assets/latest.json
          --tag "$RELEASE_TAG"
          --version "${RELEASE_VERSION#v}"
          --notes-file release-notes.txt
          --publication-date "$RELEASE_PUBLICATION_DATE"

      - name: Generate SHA-256 checksums
        run: node scripts/generate-sha256sums.mjs release-assets

      - name: Reject stale draft assets before mutation
        run: |
          set -euo pipefail
          if [[ -s release-metadata.json ]]; then
            node scripts/verify-release-assets.mjs \
              --expected release-assets \
              --release-json release-metadata.json \
              --allow-missing
          fi

      - name: Create or update draft release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_TAG_OBJECT_SHA: ${{ needs.validate.outputs.tag_object_sha }}
        run: |
          set -euo pipefail

          resolve_published_id() {
            gh api --paginate "repos/$REPOSITORY/releases?per_page=100" \
              --jq "[.[] | select(.draft == false and .tag_name == \"$RELEASE_TAG\")] | .[0].id // empty"
          }

          resolve_draft_ids() {
            gh api --paginate "repos/$REPOSITORY/releases?per_page=100" \
              --jq "[.[] | select(.draft == true and (.tag_name == \"$RELEASE_TAG\" or .name == \"NoteM $RELEASE_TAG\"))] | sort_by(.created_at) | .[].id"
          }

          current_sha="$(gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          if [[ "$current_sha" != "$EXPECTED_TAG_OBJECT_SHA" ]]; then
            echo "Release tag moved before upload; refusing to publish." >&2
            exit 1
          fi

          if [[ -n "$(resolve_published_id)" ]]; then
            echo "A non-draft release already exists for $RELEASE_TAG; refusing to modify it." >&2
            exit 1
          fi

          stale_ids="$(resolve_draft_ids)"
          if [[ -n "$stale_ids" ]]; then
            while read -r stale_id; do
              echo "Removing stale draft release $stale_id for $RELEASE_TAG." >&2
              gh api -X DELETE "repos/$REPOSITORY/releases/$stale_id" >/dev/null
            done <<<"$stale_ids"
          fi

          create_output="$(gh release create "$RELEASE_TAG" \
            --repo "$REPOSITORY" \
            --verify-tag \
            --notes-file release-notes.txt \
            --draft \
            --title "NoteM $RELEASE_TAG")"
          draft_slug="${create_output##*/}"
          if [[ "$draft_slug" != untagged-* ]]; then
            echo "Unexpected draft release URL: $create_output" >&2
            exit 1
          fi
          draft_id="$(gh api "repos/$REPOSITORY/releases/tags/$draft_slug" --jq '.id')"
          if [[ -z "$draft_id" ]]; then
            echo "Draft release was created but could not be resolved." >&2
            exit 1
          fi

          current_sha="$(gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          if [[ "$current_sha" != "$EXPECTED_TAG_OBJECT_SHA" ]]; then
            echo "Release tag moved before upload; refusing to upload assets." >&2
            exit 1
          fi

          mapfile -d '' artifacts < <(find release-assets -mindepth 1 -maxdepth 1 -type f -print0 | sort -z)
          if (( ${#artifacts[@]} == 0 )); then
            echo "No release artifacts were downloaded." >&2
            exit 1
          fi

          release_json="$(gh api "repos/$REPOSITORY/releases/$draft_id")"
          upload_url="$(jq -r '.upload_url // empty' <<<"$release_json")"
          if [[ -z "$upload_url" ]]; then
            echo "Draft release has no upload URL." >&2
            exit 1
          fi
          upload_base="${upload_url%%\{*}"
          for artifact in "${artifacts[@]}"; do
            name="$(basename "$artifact")"
            existing_asset_id="$(jq --arg name "$name" 'first(.assets[] | select(.name == $name) | .id) // empty' <<<"$release_json")"
            if [[ -n "$existing_asset_id" ]]; then
              gh api -X DELETE "repos/$REPOSITORY/releases/assets/$existing_asset_id" >/dev/null
            fi
            gh api --method POST "$upload_base?name=$name" \
              -H "Content-Type: application/octet-stream" \
              --input "$artifact" >/dev/null
          done

          fetch_release_json() {
            local destination="$1"
            local attempt
            for attempt in {1..10}; do
              if gh api "repos/$REPOSITORY/releases/$draft_id" >"$destination" 2>"${destination}.error"; then
                rm -f "${destination}.error"
                return 0
              fi
              sleep 2
            done
            cat "${destination}.error" >&2
            echo "Release metadata was not available after retries." >&2
            return 1
          }

          fetch_release_json uploaded-release.json
          node scripts/verify-release-assets.mjs \
            --expected release-assets \
            --release-json uploaded-release.json
